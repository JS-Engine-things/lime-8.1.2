name: Linux CI
on:
  workflow_dispatch:
  workflow_call:

env:
  HAXE_VERSION: 4.3.7

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp https://github.com/ShadowEngineTeam/hxcpp --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet
      - name: Enable HXCPP compile cache
        run: echo "HXCPP_COMPILE_CACHE=~/.hxcpp" >> $GITHUB_ENV
      - name: Configure Lime
        run: haxelib dev lime ${{ github.workspace }}
      - name: Rebuild Lime
        run: |
          CC=clang-23 CXX=clang++-23 HXCPP_USE_LD="lld-23" haxelib run lime rebuild linux -64 -release -D HXCPP_M64 -D HXCPP_LTO_THIN
          haxelib run lime rebuild alias
      - name: Upload Artifact (x86_64)
        uses: actions/upload-artifact@main
        with:
          name: Linux64-NDLL
          path: |
            templates/bin/alias/Linux64/
            ndll/Linux64/
            !**/.gitignore
            lime.png
          if-no-files-found: error
  linuxarm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Install system dependencies
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt update
          sudo apt-get install -y haxe libdrm-dev libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libmbedtls-dev libpng-dev libturbojpeg-dev libuv1-dev libvorbis-dev
      - name: Install Haxe dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/ShadowEngineTeam/hxcpp --quiet
          haxelib git format https://github.com/HaxeFoundation/format 9d69fb342d030fa120d2deafafbbffad248332b8 --quiet
          haxelib git hxp https://github.com/openfl/hxp 47ef5ae6569cb0961761a2fbb416694df067124c --quiet
      - name: Enable HXCPP compile cache
        run: echo "HXCPP_COMPILE_CACHE=~/.hxcpp" >> $GITHUB_ENV
      - name: Configure Lime
        run: haxelib dev lime ${{ github.workspace }}
      - name: Rebuild Lime
        run: |
          CC=clang-23 CXX=clang++-23 HXCPP_USE_LD="lld-23" haxelib run lime rebuild linux -arm64 -release -D HXCPP_ARM64 -D HXCPP_LTO_THIN
          haxelib run lime rebuild alias
      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: LinuxArm64-NDLL
          path: |
            templates/bin/alias/LinuxArm64/
            ndll/LinuxArm64/
            !**/.gitignore
            lime.png
          if-no-files-found: error
